name: CI

on:
  pull_request:
  push:
    branches: [main]

# A second push to a PR cancels the stale run; runs on main are never cancelled,
# so every merge keeps its full pipeline (SEC-F001-21).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: '1'
  TURBO_TELEMETRY_DISABLED: '1'
  DO_NOT_TRACK: '1'
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'

jobs:
  # Repository-level gates that aren't per-workspace (F-001 design §8.2). Runs outside Turbo,
  # so nothing here can be replayed from a cache.
  repo-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # Before ANY pnpm command: every pnpm command (even `pnpm --version`) installs
      # configDependencies and loads pnpmfiles, and `pnpm install` runs lifecycle scripts.
      # Plain node, no packages, no subprocess (tooling/repo-scripts/src/config-gate.ts).
      - name: Pre-install config gate
        run: node tooling/repo-scripts/src/pre-install-gate.ts
      # pnpm comes from Corepack, which verifies the sha512 in package.json#packageManager.
      - name: Enable pnpm through Corepack
        run: |
          corepack enable
          pnpm --version
      - name: Locate pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      # check-workspaces (coverage, contract, lifecycle scripts, build settings, specifiers,
      # packs/, Python), check-tsrefs, check-turbo-config, check-banned-deps (lockfile graph),
      # check-imports (dependency-cruiser), then prettier --check.
      - run: pnpm repo:check

  # Every workspace's lint, typecheck, test and build (AC-1). --continue=dependencies-successful
  # lets the other workspaces finish when one fails, so the summary lists every result.
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # Before ANY pnpm command: every pnpm command (even `pnpm --version`) installs
      # configDependencies and loads pnpmfiles, and `pnpm install` runs lifecycle scripts.
      # Plain node, no packages, no subprocess (tooling/repo-scripts/src/config-gate.ts).
      - name: Pre-install config gate
        run: node tooling/repo-scripts/src/pre-install-gate.ts
      - name: Enable pnpm through Corepack
        run: |
          corepack enable
          pnpm --version
      - name: Locate pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      # gitleaks before the Turbo run: the @ralysa/repo-scripts tests run the real, hash-pinned
      # binary (TC-F-001-03, -37, -38, -39), and the artefact scan below uses it too.
      - uses: actions/cache@v4
        with:
          path: .tools/gitleaks
          key: tools-gitleaks-${{ runner.os }}-${{ hashFiles('tooling/repo-scripts/bin/tool-hashes.txt') }}
      # Downloads the hash-pinned binary, or re-verifies a cached one; the wrapper re-hashes it
      # again before every run (SEC-F001-20).
      - name: Install gitleaks
        run: sh tooling/repo-scripts/bin/install-tool.sh gitleaks
      # Turbo local cache only; the remote cache is disabled in turbo.json (SEC-F001-12).
      # PR runs can read main's caches but main can't read PR caches.
      - uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-quality-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-quality-${{ runner.os }}-
      - name: Lint, typecheck, test and build every workspace
        run: pnpm exec turbo run lint typecheck test build check:generated --continue=dependencies-successful --summarize
      # Generated files must be committed: catches modified and new untracked files (AR-7).
      - name: No generated-file drift
        run: |
          drift="$(git status --porcelain)"
          if [ -n "$drift" ]; then
            echo "$drift"
            echo "::error::Generated files are out of date or uncommitted. Run the build locally and commit the result."
            exit 1
          fi
      - name: Workspace summary
        if: ${{ !cancelled() }}
        run: node tooling/repo-scripts/src/cli.ts summary --out "$GITHUB_STEP_SUMMARY"
      # Outside Turbo and uncached (SEC-F001-23): every shipped artefact, with the allow-list-free
      # .gitleaks.artefacts.toml. A missing artefact path fails (AC-2, SEC-F001-05).
      - name: Secret scan of shipped artefacts
        run: node tooling/repo-scripts/src/secret-scan-cli.ts artefacts
      # No model-provider API hostname in any shipped artefact (SR-03, SEC-F001-09 d). The
      # tracked-source half of this check runs in repo-checks.
      - name: Provider hostnames in shipped artefacts
        if: ${{ !cancelled() }}
        run: node tooling/repo-scripts/src/cli.ts check-provider-hosts --artefacts
      # No demo screen or sample data in any shipped build (AC-13, TC-F-001-27): the ui-lab
      # sentinel and every sample string, searched in every shipped artefact, with the ui-lab
      # build itself as the positive control. Outside Turbo and uncached, like the steps above.
      - name: No demo content in shipped artefacts
        if: ${{ !cancelled() }}
        run: node tooling/repo-scripts/src/cli.ts check-no-demo
      - name: Upload secret-scan reports (secrets redacted)
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: secret-scan-artefacts
          path: ${{ runner.temp }}/secret-scan-reports
          if-no-files-found: ignore

  # Secret scanning of the repository (F-001 design §6.2.3, §6.2.5). No install and no build, so
  # nothing from the PR runs before the scan; only plain node and the hash-pinned gitleaks.
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # The whole history, so the PR base commit is present for the range scan (SEC-F001-06).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/cache@v4
        with:
          path: .tools/gitleaks
          key: tools-gitleaks-${{ runner.os }}-${{ hashFiles('tooling/repo-scripts/bin/tool-hashes.txt') }}
      - name: Install gitleaks
        run: sh tooling/repo-scripts/bin/install-tool.sh gitleaks
      # Fails on an empty range ("is the base commit fetched?") and on any gitleaks exit code
      # other than 0 or 1.
      - name: Scan the PR's new commits
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: node tooling/repo-scripts/src/secret-scan-cli.ts pr --base "$BASE" --head "$HEAD"
      - name: Scan the working tree
        if: ${{ !cancelled() }}
        run: node tooling/repo-scripts/src/secret-scan-cli.ts tree
      - name: Scan the full history
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: node tooling/repo-scripts/src/secret-scan-cli.ts history
      # dir, git, artefact and canary cases with runtime-assembled synthetic credentials.
      - name: Scanner self-tests
        if: ${{ !cancelled() }}
        run: node tooling/repo-scripts/src/secret-scan-cli.ts selftest
      - name: Upload secret-scan reports (secrets redacted)
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: secret-scan-reports
          path: ${{ runner.temp }}/secret-scan-reports
          if-no-files-found: ignore

  pr-traceability:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: PR must reference a feature (F-nnn) or be labelled chore/docs
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          if echo "$TITLE $BODY" | grep -Eq 'F-[0-9]{3}'; then exit 0; fi
          if echo "$LABELS" | grep -Eq '(^|,)(chore|docs|adlc)(,|$)'; then exit 0; fi
          echo "::error::Reference a feature ID (F-nnn) in the PR title/body, or add a chore/docs/adlc label."
          exit 1
