name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  pr-traceability:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: PR must reference a feature (F-nnn) or be labelled chore/docs
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          if echo "$TITLE $BODY" | grep -Eq 'F-[0-9]{3}'; then exit 0; fi
          if echo "$LABELS" | grep -Eq '(^|,)(chore|docs|adlc)(,|$)'; then exit 0; fi
          echo "::error::Reference a feature ID (F-nnn) in the PR title/body, or add a chore/docs/adlc label."
          exit 1
