name: Bug
description: A defect found in development, testing, UAT or production
labels: [bug]
body:
  - type: input
    id: feature
    attributes: { label: Related feature, placeholder: F-001 }
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options: [Blocker, Major, Minor, Trivial]
    validations: { required: true }
  - type: dropdown
    id: found
    attributes:
      label: Found in
      options: [Development, Testing (G6), UAT (G8), Production]
  - type: textarea
    id: steps
    attributes: { label: Steps to reproduce }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: Expected vs actual }
  - type: input
    id: version
    attributes: { label: Version / commit, placeholder: v0.1.0-rc.1 }
