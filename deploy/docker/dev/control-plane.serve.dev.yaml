# Dev-stack config for `control-plane serve` (F-002 design §3.8, §8.2). Identifiers and vault
# paths only. The OpenBao token is read from the environment variable named below
# (pnpm --filter @ralysa/control-plane start:dev loads deploy/docker/dev/.env); token auth is
# refused outside env dev/test. The IdP values point at the mock IdP (T09, port 59400).
env: dev
org:
  id: 0192a0c0-0000-7000-8000-00000000d0e1
  name: Ralysa Dev
  residency: in_country
  region: qa-doha
  deployment_model: on_prem
vault:
  addr: http://127.0.0.1:58200
  auth:
    method: token
    token_env: BAO_DEV_ROOT_TOKEN_ID
db:
  host: 127.0.0.1
  port: 55432
  database: ralysa
  ssl: false
public_base_url: http://127.0.0.1:4100
listen:
  host: 127.0.0.1
  port: 4100
signing_key: ralysa-rts-signing
idp:
  kind: entra
  tenant_id: 0192a0c0-0000-4000-8000-00000000de01
  issuer: http://127.0.0.1:59400/0192a0c0-0000-4000-8000-00000000de01/v2.0
  rts_client_id: 0192a0c0-0000-4000-8000-00000000de02
  allowed_public_client_ids: [0192a0c0-0000-4000-8000-00000000de03]
  signin_scope: api://ralysa-rts-dev/Ralysa.SignIn
  client_secret_path: kv/ralysa/control-plane/idp-client-secret
  graph_base_url: http://127.0.0.1:59400/graph
access:
  access_group_id: 0192a0c0-0000-4000-8000-00000000de10
  admin_group_id: 0192a0c0-0000-4000-8000-00000000de11
audit:
  spool_dir: ../../deploy/docker/dev/.audit-spool
  spool_persistent: false
audit_hmac_path: kv/ralysa/control-plane/audit-hmac
db_credentials:
  cp_app: kv/ralysa/control-plane/db/cp_app
  audit_writer: kv/ralysa/control-plane/db/audit_writer
  audit_reader: kv/ralysa/control-plane/db/audit_reader
