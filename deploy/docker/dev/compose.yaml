# Ralysa local dev and test stack (F-002 design §8.2, D-19). The same file serves developers and the
# CI `integration` job, so the two can't drift [AR-13].
#
#   node tooling/dev-stack/src/cli.ts env                      # writes deploy/docker/dev/.env (0600, random)
#   docker compose -f deploy/docker/dev/compose.yaml --env-file deploy/docker/dev/.env up -d --wait
#   node tooling/dev-stack/src/cli.ts bootstrap                # roles, OpenBao keys, KV, policies
#
# The mock IdP (profile `idp`, F-002-T09) is for manual runs; tests start it in-process instead:
#   pnpm --filter @ralysa/dev-stack build
#   docker compose -f deploy/docker/dev/compose.yaml --env-file deploy/docker/dev/.env --profile idp up -d --wait mock-idp
#
# Every port is bound to 127.0.0.1 only. Images are pinned by digest (checked 2026-09-25; see
# docs/features/F-002-sso-control-plane-skeleton/implementation-notes.md, T02). No secret value is
# in this file: the two credentials come from the generated, git-ignored .env.
name: ralysa-dev

services:
  postgres:
    image: postgres:17.11@sha256:d74eeac9a635390a49bc21bd49fccd973de707e2a53a76ac49b552b8712ec46f
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run "node tooling/dev-stack/src/cli.ts env" first}
      POSTGRES_DB: ralysa
      # UTF-8 server encoding (AC-15); the bootstrap and the migrators refuse anything else.
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C.UTF-8 --auth-host=scram-sha-256 --auth-local=trust
    command:
      - postgres
      # OQ-D1 / D-31 condition: user, database, application and client on every log line, so a
      # refused UPDATE/DELETE on audit.* (SQLSTATE 42501) is attributable.
      - -c
      - log_line_prefix=%m [%p] user=%u db=%d app=%a client=%h
      - -c
      - log_min_error_statement=error
      # SEC-F002-29: role passwords are stored as SCRAM verifiers only.
      - -c
      - password_encryption=scram-sha-256
    ports:
      - '127.0.0.1:55432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'postgres', '-d', 'ralysa']
      interval: 2s
      timeout: 5s
      retries: 30

  openbao:
    # OpenBao dev server (in-memory storage, auto-unsealed). Never used outside dev and CI: the
    # control plane's production guards refuse an in-memory OpenBao (design §3.8, SEC-F002-12).
    image: quay.io/openbao/openbao:2.6.2@sha256:11fd73a2102cda9c55d5d881a8c3210303146a7ec1e8ac76f526e175c6d24641
    command: ['server', '-dev', '-dev-listen-address=0.0.0.0:8200']
    environment:
      BAO_DEV_ROOT_TOKEN_ID: ${BAO_DEV_ROOT_TOKEN_ID:?run "node tooling/dev-stack/src/cli.ts env" first}
      BAO_ADDR: http://127.0.0.1:8200
      SKIP_SETCAP: 'true'
    ports:
      - '127.0.0.1:58200:8200'
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ['CMD', 'bao', 'status']
      interval: 2s
      timeout: 5s
      retries: 30

  mock-idp:
    # Entra-shaped mock IdP and Graph stub (design §8.3). Runs the built dev-stack from read-only
    # bind mounts of exactly what it needs (its dist, package.json and node_modules, and the pnpm
    # store they link into), so nothing is installed or built in the container and nothing else
    # in the repository (deploy/docker/dev/.env above all) is visible to it. It sits on its own
    # network with no route to postgres or openbao. Never shipped (SEC-F002-13). Its ids match
    # control-plane.serve.dev.yaml.
    profiles: [idp]
    image: node:24.21.0-alpine@sha256:ebfe2f90462722a7a4de65e91990e97fe0d401c70e0e762c5b53302f905ec1c1
    user: node
    working_dir: /repo
    command: ['node', 'tooling/dev-stack/dist/mock-idp/main.js']
    environment:
      # 0.0.0.0 inside the container only, so the published 127.0.0.1 port reaches it. The
      # test-control API always binds the container's 127.0.0.1 and is not published: use
      # `docker compose … exec mock-idp node tooling/dev-stack/dist/mock-idp/main.js control GET /users`.
      MOCK_IDP_HOST: 0.0.0.0
      MOCK_IDP_IN_CONTAINER: '1'
      MOCK_IDP_PORT: '59400'
      MOCK_IDP_PUBLIC_BASE_URL: http://127.0.0.1:59400
      MOCK_IDP_CONTROL_TOKEN_FILE: /tmp/mock-idp/control-token
    ports:
      - '127.0.0.1:59400:59400'
    volumes:
      - ../../../tooling/dev-stack/dist:/repo/tooling/dev-stack/dist:ro
      - ../../../tooling/dev-stack/package.json:/repo/tooling/dev-stack/package.json:ro
      - ../../../tooling/dev-stack/node_modules:/repo/tooling/dev-stack/node_modules:ro
      - ../../../node_modules/.pnpm:/repo/node_modules/.pnpm:ro
    networks: [idp]
    read_only: true
    tmpfs:
      - /tmp:uid=1000,gid=1000,mode=0700
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    healthcheck:
      test:
        - CMD
        - wget
        - -qO-
        - http://127.0.0.1:59400/0192a0c0-0000-4000-8000-00000000de01/v2.0/.well-known/openid-configuration
      interval: 2s
      timeout: 5s
      retries: 30

networks:
  # The mock IdP's own network: postgres and openbao are on `default` only.
  idp: {}

volumes:
  postgres-data:
