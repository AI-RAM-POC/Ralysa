# Ralysa local dev and test stack (F-002 design §8.2, D-19). The same file serves developers and the
# CI `integration` job, so the two can't drift [AR-13].
#
#   node tooling/dev-stack/src/cli.ts env                      # writes deploy/docker/dev/.env (0600, random)
#   docker compose -f deploy/docker/dev/compose.yaml --env-file deploy/docker/dev/.env up -d --wait
#   node tooling/dev-stack/src/cli.ts bootstrap                # roles, OpenBao keys, KV, policies
#
# Every port is bound to 127.0.0.1 only. Images are pinned by digest (checked 2026-09-25; see
# docs/features/F-002-sso-control-plane-skeleton/implementation-notes.md, T02). No secret value is
# in this file: the two credentials come from the generated, git-ignored .env.
name: ralysa-dev

services:
  postgres:
    image: postgres:17.11@sha256:d74eeac9a635390a49bc21bd49fccd973de707e2a53a76ac49b552b8712ec46f
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run "node tooling/dev-stack/src/cli.ts env" first}
      POSTGRES_DB: ralysa
      # UTF-8 server encoding (AC-15); the bootstrap and the migrators refuse anything else.
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C.UTF-8 --auth-host=scram-sha-256 --auth-local=trust
    command:
      - postgres
      # OQ-D1 / D-31 condition: user, database, application and client on every log line, so a
      # refused UPDATE/DELETE on audit.* (SQLSTATE 42501) is attributable.
      - -c
      - log_line_prefix=%m [%p] user=%u db=%d app=%a client=%h
      - -c
      - log_min_error_statement=error
      # SEC-F002-29: role passwords are stored as SCRAM verifiers only.
      - -c
      - password_encryption=scram-sha-256
    ports:
      - '127.0.0.1:55432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'postgres', '-d', 'ralysa']
      interval: 2s
      timeout: 5s
      retries: 30

  openbao:
    # OpenBao dev server (in-memory storage, auto-unsealed). Never used outside dev and CI: the
    # control plane's production guards refuse an in-memory OpenBao (design §3.8, SEC-F002-12).
    image: quay.io/openbao/openbao:2.6.2@sha256:11fd73a2102cda9c55d5d881a8c3210303146a7ec1e8ac76f526e175c6d24641
    command: ['server', '-dev', '-dev-listen-address=0.0.0.0:8200']
    environment:
      BAO_DEV_ROOT_TOKEN_ID: ${BAO_DEV_ROOT_TOKEN_ID:?run "node tooling/dev-stack/src/cli.ts env" first}
      BAO_ADDR: http://127.0.0.1:8200
      SKIP_SETCAP: 'true'
    ports:
      - '127.0.0.1:58200:8200'
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ['CMD', 'bao', 'status']
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  postgres-data:
