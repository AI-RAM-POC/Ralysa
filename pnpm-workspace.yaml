# Workspace packages. packs/* is deliberately NOT a workspace (RF-7, F-001 design §6.4):
# department packs are content, never part of the build graph.
packages:
  - 'apps/*'
  - 'packages/*'
  - 'services/*'
  - 'tooling/*'

# Supply-chain settings (F-001 design §6.4; RF-3, SEC-F001-19, -20).
# Install fails on any dependency build script that is not reviewed below.
strictDepBuilds: true
# Every entry defaults to false. A `true` entry needs a matching reviewed entry in
# tooling/repo-scripts/allow-builds.json (reason, reviewer, date); check-workspaces enforces it.
allowBuilds:
  # i18next-cli's SWC parser. Its postinstall only checks for a native binding, which arrives as a
  # platform optionalDependency, so the script stays blocked (F-001-T08, SEC-F001-19).
  '@swc/core': false
# 3 days (pnpm 11 default is 1 day).
minimumReleaseAge: 4320
# Transitive dependencies may only come from the registry.
blockExoticSubdeps: true
# Refuse a version whose publish provenance is weaker than an earlier version's.
trustPolicy: no-downgrade
# Reviewed exceptions to trustPolicy (exact versions only; each needs a reason).
trustPolicyExclude:
  # 6.3.1 is the 2023-07-10 security backport on the 6.x line (CVE-2022-25883), published by the
  # npm CLI team three days after the provenance-attested 7.5.4. It has no attestation because
  # the 6.x release pipeline never had one, not because of a takeover. Pulled in by
  # @babel/core (via eslint-plugin-react-hooks). Reviewed 2026-09-25, F-001-T02.
  - semver@6.3.1

# One version per shared toolchain package, referenced as "catalog:" (architect review AR-7).
catalog:
  '@axe-core/playwright': 4.13.0
  '@playwright/test': 1.63.0
  '@radix-ui/react-direction': 1.1.4
  '@tailwindcss/vite': 4.3.3
  '@types/node': 24.13.6
  '@types/pg': 8.23.1
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  '@vitejs/plugin-react': 6.1.1
  eslint: 10.11.0
  i18next: 26.4.2
  i18next-cli: 1.74.1
  jsdom: 30.1.0
  kysely: 0.29.6
  pg: 8.23.0
  radix-ui: 1.6.7
  react: 19.3.0
  react-dom: 19.3.0
  react-i18next: 17.0.15
  stylelint: 17.15.0
  tailwindcss: 4.3.3
  typescript: 6.0.3
  vite: 8.3.0
  vitest: 4.1.11
  yaml: 2.9.1
  zod: 4.6.5
